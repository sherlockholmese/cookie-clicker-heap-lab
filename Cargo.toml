[workspace]
members = ["crates/app", "crates/ui", "crates/vm-core", "crates/vm-heap", "crates/cookie-game", "crates/debugger", "crates/save-state"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
vm-core = { path = "crates/vm-core" }
vm-heap = { path = "crates/vm-heap" }
cookie-game = { path = "crates/cookie-game" }
debugger = { path = "crates/debugger" }
save-state = { path = "crates/save-state" }
cookie-ui = { path = "crates/ui" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
