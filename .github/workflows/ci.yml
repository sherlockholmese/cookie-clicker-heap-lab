name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build (${{ matrix.platform }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libopengl0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . -r requirements-build.txt
      - run: python -m compileall -q cookie_clicker tests
      - run: python -m unittest discover -v
      - name: Offscreen GUI smoke
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tests.gui_smoke
      - name: Build and check executable
        run: python scripts/build_executable.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: cookie-clicker-pwn-${{ matrix.platform }}
          path: ${{ runner.os == 'Windows' && 'dist/*.exe' || 'dist/*.tar.gz' }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
