name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libopengl0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install PyQt6
      - run: python -m compileall -q cookie_clicker tests
      - run: python -m unittest discover -v
      - name: Offscreen GUI smoke
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tests.gui_smoke
